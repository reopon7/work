name: Build randomness_testsuite Windows EXE

on:
  push:
    branches:
      - build/randomness-testsuite-win11
  workflow_dispatch:

jobs:
  build-win11:
    runs-on: windows-latest
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Checkout exact upstream source
        shell: pwsh
        run: |
          git clone https://github.com/stevenang/randomness_testsuite.git src
          cd src
          git checkout 428f1036b6436fa90896a496528c4f9174befd6d

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install numpy scipy pyinstaller

      - name: Apply Vehicle HEX GUI
        shell: pwsh
        run: |
          Copy-Item build/randomness_ui_v3/VehicleHexMain.py src/VehicleHexMain.py -Force
          python -m py_compile src/VehicleHexMain.py
          @'
          0x00 0x11 0x22 0x33 0x44 0x55 0x66 0x77
          0x88 0x99 0xaa 0xbb 0xcc 0xdd 0xee 0xff
          '@ | Set-Content -Encoding ascii src/parser_smoke.txt
          cd src
          python -c "from VehicleHexMain import parse_hex_seed_file; p=parse_hex_seed_file('parser_smoke.txt'); assert len(p['seeds'])==2; assert len(p['raw_bytes'])==16; assert len(p['bitstream'])==128; assert p['unique_count']==2; print('HEX parser smoke PASS')"

      - name: Build Vehicle HEX GUI EXE
        shell: pwsh
        run: |
          cd src
          pyinstaller --noconfirm --clean --onefile --windowed --name NIST_Randomness_Test_Suite_Vehicle_HEX VehicleHexMain.py

      - name: Verify PE and hash
        shell: pwsh
        run: |
          $exe = 'src\dist\NIST_Randomness_Test_Suite_Vehicle_HEX.exe'
          if (-not (Test-Path $exe)) { throw 'EXE not produced' }
          Get-Item $exe | Format-List Name,Length,FullName
          Get-FileHash $exe -Algorithm SHA256

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: NIST_Randomness_Test_Suite_Vehicle_HEX_Win11_x64
          path: src/dist/NIST_Randomness_Test_Suite_Vehicle_HEX.exe
          if-no-files-found: error
          compression-level: 0
