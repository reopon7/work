name: Fetch APK Signer Tool

on:
  push:
    branches:
      - habit-java-v44-webview-overlay
    paths:
      - '.github/workflows/fetch-uber-apk-signer.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download uber-apk-signer
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3             https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar             -o uber-apk-signer-1.3.0.jar
          test -s uber-apk-signer-1.3.0.jar
          sha256sum uber-apk-signer-1.3.0.jar > uber-apk-signer-1.3.0.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: uber-apk-signer-1.3.0
          path: |
            uber-apk-signer-1.3.0.jar
            uber-apk-signer-1.3.0.sha256
          if-no-files-found: error
