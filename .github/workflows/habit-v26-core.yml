name: Habit V26 Core Java Migration

on:
  push:
    branches:
      - habit-java-v26-core
    paths:
      - 'habit-v26/**'
      - '.github/workflows/habit-v26-core.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android API
        id: android
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_JAR="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)"
          test -f "$ANDROID_JAR"
          echo "android_jar=$ANDROID_JAR" >> "$GITHUB_OUTPUT"

      - name: Compile legacy API stubs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/stubs build/app build/tools build/out
          find habit-v26/compile-stubs -name '*.java' | sort > build/stub-sources.txt
          javac -source 8 -target 8             -cp "${{ steps.android.outputs.android_jar }}"             -d build/stubs             @build/stub-sources.txt

      - name: Compile real Java sources
        shell: bash
        run: |
          set -euxo pipefail
          find habit-v26/app/src/main/java -name '*.java' | sort > build/app-sources.txt
          javac -source 8 -target 8             -cp "${{ steps.android.outputs.android_jar }}:build/stubs"             -d build/app             @build/app-sources.txt
          find build/app -type f -print | sort | tee build/out/compiled-classes.txt

      - name: Verify migrated class is real Java bytecode
        shell: bash
        run: |
          set -euxo pipefail
          javap -classpath "${{ steps.android.outputs.android_jar }}:build/stubs:build/app"             -c -p -s             jp.ddo.pigsty.HabitBrowser.Features.Browser.Util.WebViewManager             > build/out/WebViewManager.javap.txt
          grep -q 'createWebView' build/out/WebViewManager.javap.txt
          grep -q 'createWebViewData' build/out/WebViewManager.javap.txt
          grep -q 'notifyLowMemory' build/out/WebViewManager.javap.txt
          if find build/app -name 'WebViewManager$1.class' | grep -q .; then
            echo 'ERROR: anonymous class collides with legacy WebViewManager$1'
            exit 1
          fi
          find build/app -name 'WebViewManager$RemoveTabRunnable.class' | grep -q .

      - name: Download Android dx
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3             https://raw.githubusercontent.com/CYRUS-STUDIO/dex2jar/main/lib/dx-30.0.2.jar             -o build/tools/dx.jar
          test -s build/tools/dx.jar

      - name: Build classes2.dex
        shell: bash
        run: |
          set -euxo pipefail
          java -jar build/tools/dx.jar             --dex             --min-sdk-version=21             --output=build/out/classes2.dex             build/app
          test -s build/out/classes2.dex
          sha256sum build/out/classes2.dex | tee build/out/classes2.sha256
          strings build/out/classes2.dex | grep -E             'WebViewManager|RemoveTabRunnable|HabitJavaCompat|setAcceptThirdPartyCookies'             > build/out/classes2.strings.txt || true
          cat build/out/classes2.strings.txt

      - name: Package source snapshot
        shell: bash
        run: |
          set -euxo pipefail
          cp -a habit-v26 build/out/HABIT_BROWSER_V26_CORE_SOURCE
          cd build/out
          zip -r HABIT_BROWSER_V26_CORE_SOURCE.zip HABIT_BROWSER_V26_CORE_SOURCE
          cd ../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: habit-v26-core-java
          path: |
            build/out/classes2.dex
            build/out/classes2.sha256
            build/out/classes2.strings.txt
            build/out/compiled-classes.txt
            build/out/WebViewManager.javap.txt
            build/out/HABIT_BROWSER_V26_CORE_SOURCE.zip
          if-no-files-found: error
