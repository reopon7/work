name: Habit V21 Java DEX

on:
  push:
    branches:
      - habit-java-v21
    paths:
      - 'habit-v21/**'
      - '.github/workflows/habit-v21-java.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android API
        id: android
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_JAR="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)"
          test -f "$ANDROID_JAR"
          echo "android_jar=$ANDROID_JAR" >> "$GITHUB_OUTPUT"
          echo "Using $ANDROID_JAR"

      - name: Compile legacy superclass stub
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/stubs build/app build/tools build/out
          javac -source 8 -target 8 \
            -cp "${{ steps.android.outputs.android_jar }}" \
            -d build/stubs \
            habit-v21/compile-stubs/jp/ddo/pigsty/HabitBrowser/Component/Application/App.java

      - name: Compile real Java compatibility source
        shell: bash
        run: |
          set -euxo pipefail
          javac -source 8 -target 8 \
            -cp "${{ steps.android.outputs.android_jar }}:build/stubs" \
            -d build/app \
            habit-v21/app/src/main/java/jp/ddo/pigsty/HabitBrowser/Component/Application/Mod.java
          find build/app -type f -print
          javap -classpath "${{ steps.android.outputs.android_jar }}:build/stubs:build/app" \
            -c -p jp.ddo.pigsty.HabitBrowser.Component.Application.Mod \
            > build/out/Mod.javap.txt

      - name: Download Android dx
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/CYRUS-STUDIO/dex2jar/main/lib/dx-30.0.2.jar \
            -o build/tools/dx.jar
          test -s build/tools/dx.jar
          sha256sum build/tools/dx.jar

      - name: Convert Java class to classes2.dex
        shell: bash
        run: |
          set -euxo pipefail
          java -jar build/tools/dx.jar \
            --dex \
            --min-sdk-version=21 \
            --output=build/out/classes2.dex \
            build/app
          test -s build/out/classes2.dex
          sha256sum build/out/classes2.dex | tee build/out/classes2.sha256
          strings build/out/classes2.dex | grep -E             'HabitJavaCompat|setMediaPlaybackRequiresUserGesture|setAcceptThirdPartyCookies|MIXED_CONTENT'             > build/out/classes2.strings.txt || true
          cat build/out/classes2.strings.txt

      - name: Verify no compile stub was packaged
        shell: bash
        run: |
          set -euxo pipefail
          if strings build/out/classes2.dex | grep -q 'compile-time stub'; then
            echo "Unexpected compile stub payload"
            exit 1
          fi
          strings build/out/classes2.dex | grep -q 'HabitJavaCompat'
          strings build/out/classes2.dex | grep -q 'setMediaPlaybackRequiresUserGesture'
          strings build/out/classes2.dex | grep -q 'setAcceptThirdPartyCookies'

      - name: Package source snapshot
        shell: bash
        run: |
          set -euxo pipefail
          cd habit-v21
          zip -r ../build/out/HABIT_V21_JAVA_SOURCE.zip app compile-stubs README.md
          cd ..

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: habit-v21-java-dex
          path: |
            build/out/classes2.dex
            build/out/classes2.sha256
            build/out/classes2.strings.txt
            build/out/Mod.javap.txt
            build/out/HABIT_V21_JAVA_SOURCE.zip
          if-no-files-found: error
