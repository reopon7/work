name: Habit V28 Browser Models Java Migration

on:
  push:
    branches:
      - habit-java-v28-models
    paths:
      - 'habit-v26/**'
      - '.github/workflows/habit-v28-models.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android API
        id: android
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_JAR="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)"
          test -f "$ANDROID_JAR"
          echo "android_jar=$ANDROID_JAR" >> "$GITHUB_OUTPUT"

      - name: Compile legacy API stubs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/stubs build/app build/tools build/out
          find habit-v26/compile-stubs -name '*.java' | sort > build/stub-sources.txt
          javac -source 8 -target 8 \
            -cp "${{ steps.android.outputs.android_jar }}" \
            -d build/stubs \
            @build/stub-sources.txt

      - name: Compile real Java sources
        shell: bash
        run: |
          set -euxo pipefail
          find habit-v26/app/src/main/java -name '*.java' | sort > build/app-sources.txt
          javac -source 8 -target 8 \
            -cp "${{ steps.android.outputs.android_jar }}:build/stubs" \
            -d build/app \
            @build/app-sources.txt
          find build/app -type f -print | sort | tee build/out/compiled-classes.txt

      - name: Verify reconstructed Java bytecode
        shell: bash
        run: |
          set -euxo pipefail
          CP="build/app:build/stubs:${{ steps.android.outputs.android_jar }}"

          for CLS in \
            jp.ddo.pigsty.HabitBrowser.Features.Browser.Util.WebViewManager \
            jp.ddo.pigsty.HabitBrowser.Features.Browser.Util.WebViewTimerManager \
            jp.ddo.pigsty.HabitBrowser.Features.Browser.Util.CookieUtil \
            jp.ddo.pigsty.HabitBrowser.Features.UserAgent.Util.UserAgentManager \
            jp.ddo.pigsty.HabitBrowser.Features.UserAgentPattern.Util.UserAgentPatternManager \
            jp.ddo.pigsty.HabitBrowser.Features.SettingPattern.Util.SettingPatternManager \
            jp.ddo.pigsty.HabitBrowser.Features.Browser.Model.ActionInfo \
            jp.ddo.pigsty.HabitBrowser.Features.Browser.Model.ConfigrationStatus \
            jp.ddo.pigsty.HabitBrowser.Features.Browser.Model.ForwardInfo \
            jp.ddo.pigsty.HabitBrowser.Features.Browser.Model.HttpPostData \
            jp.ddo.pigsty.HabitBrowser.Features.Browser.Util.ForwardManager \
            'jp.ddo.pigsty.HabitBrowser.Features.Browser.View.HabitWebView$IJSProxy' \
            'jp.ddo.pigsty.HabitBrowser.Features.Browser.View.HabitWebView$OnScrollChangedListener' \
            'jp.ddo.pigsty.HabitBrowser.Features.Browser.View.HabitWebView$OnThumbnailListener'
          do
            SAFE="$(echo "$CLS" | tr '.$' '__')"
            javap -classpath "$CP" -c -p -s "$CLS" > "build/out/$SAFE.javap.txt"
          done

          test -f 'build/app/jp/ddo/pigsty/HabitBrowser/Features/Browser/Model/ForwardInfo$1.class'
          grep -q 'getPostByte' build/out/jp_ddo_pigsty_HabitBrowser_Features_Browser_Model_HttpPostData.javap.txt
          grep -q 'createForwardIntentData' build/out/jp_ddo_pigsty_HabitBrowser_Features_Browser_Util_ForwardManager.javap.txt
          grep -q 'movieMusicAction' build/out/jp_ddo_pigsty_HabitBrowser_Features_Browser_Model_ConfigrationStatus.javap.txt
          grep -q 'proxySubmitPost' 'build/out/jp_ddo_pigsty_HabitBrowser_Features_Browser_View_HabitWebView_IJSProxy.javap.txt'

      - name: Download Android dx
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/CYRUS-STUDIO/dex2jar/main/lib/dx-30.0.2.jar \
            -o build/tools/dx.jar
          test -s build/tools/dx.jar

      - name: Build classes2.dex
        shell: bash
        run: |
          set -euxo pipefail
          java -jar build/tools/dx.jar \
            --dex \
            --min-sdk-version=21 \
            --output=build/out/classes2.dex \
            build/app
          test -s build/out/classes2.dex
          sha256sum build/out/classes2.dex | tee build/out/classes2.sha256
          strings build/out/classes2.dex | grep -E \
            'ConfigrationStatus|ForwardInfo|HttpPostData|ForwardManager|ActionInfo|HabitWebView.IJSProxy|WebViewManager|HabitJavaCompat' \
            > build/out/classes2.strings.txt || true
          cat build/out/classes2.strings.txt

      - name: Package source snapshot
        shell: bash
        run: |
          set -euxo pipefail
          cp -a habit-v26 build/out/HABIT_BROWSER_V28_MODEL_SOURCE
          cd build/out
          zip -r HABIT_BROWSER_V28_MODEL_SOURCE.zip HABIT_BROWSER_V28_MODEL_SOURCE
          cd ../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: habit-v28-model-java
          path: |
            build/out/classes2.dex
            build/out/classes2.sha256
            build/out/classes2.strings.txt
            build/out/compiled-classes.txt
            build/out/*.javap.txt
            build/out/HABIT_BROWSER_V28_MODEL_SOURCE.zip
          if-no-files-found: error
